---
name: Continuous Delivery
on:
  workflow_call:
    inputs:
      skip_what_if:
        default: true
        type: boolean
      governance-int-root:
        type: boolean
        default: true
      governance-landingzones:
        type: boolean
        default: true
      governance-landingzones-corp:
        type: boolean
        default: true
      governance-landingzones-online:
        type: boolean
        default: true
      governance-platform:
        type: boolean
        default: true
      governance-platform-connectivity:
        type: boolean
        default: true
      governance-platform-identity:
        type: boolean
        default: true
      governance-platform-management:
        type: boolean
        default: true
      governance-platform-security:
        type: boolean
        default: true
      governance-sandbox:
        type: boolean
        default: true
      governance-decommissioned:
        type: boolean
        default: true
      governance-platform-rbac:
        type: boolean
        default: true
      governance-platform-connectivity-rbac:
        type: boolean
        default: true
      governance-landingzones-rbac:
        type: boolean
        default: true
      core-logging:
        type: boolean
        default: true
      networking-hubnetworking:
        type: boolean
        default: true

jobs:
  # ============================================================
  # What-If (single job — validation is fast)
  # ============================================================
  whatif:
    name: What If
    runs-on: ubuntu-latest
    environment: cmalz-mgmt-plan
    permissions:
      id-token: write
      contents: read
    if: ${{ !inputs.skip_what_if }}
    env:
      PARAMETERS_FILE_NAME: parameters.json

    steps:
      - name: Show inputs
        run: |
          Write-Host '${{ toJson(inputs) }}'
        shell: pwsh

      - name: Checkout Bicep Module
        uses: actions/checkout@v4

      - name: Get Bicep Variables
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-variables@main
        with:
          parameters_file_name: ${{ env.PARAMETERS_FILE_NAME }}

      - name: Install Bicep and Update Az Module
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-installer@main

      - name: OIDC Login to Tenant
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Check for First Deployment
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-first-deployment-check@main
        with:
          managementGroupId: ${{ env.MANAGEMENT_GROUP_ID }}

      - name: 'Plan: Governance-Intermediate Root'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-int-root }}
        with:
          name: 'governance-int-root'
          displayName: 'Governance-Intermediate Root'
          templateFilePath: 'templates/core/governance/mgmt-groups/int-root/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/int-root/main.bicepparam'
          managementGroupId: '${{ env.MANAGEMENT_GROUP_ID }}'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'
          firstRunWhatIf: 'false'
          whatIfEnabled: 'true'

      - name: 'Plan: Governance-Landing Zones'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-landingzones }}
        with:
          name: 'governance-landingzones'
          displayName: 'Governance-Landing Zones'
          templateFilePath: 'templates/core/governance/mgmt-groups/landingzones/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/landingzones/main.bicepparam'
          managementGroupId: '${{ env.MANAGEMENT_GROUP_ID }}'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'
          firstRunWhatIf: 'false'
          whatIfEnabled: 'true'

      - name: 'Plan: Governance-Landing Zones Corp'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-landingzones-corp }}
        with:
          name: 'governance-landingzones-corp'
          displayName: 'Governance-Landing Zones Corp'
          templateFilePath: 'templates/core/governance/mgmt-groups/landingzones/landingzones-corp/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/landingzones/landingzones-corp/main.bicepparam'
          managementGroupId: '${{ env.MANAGEMENT_GROUP_ID }}'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'
          firstRunWhatIf: 'false'
          whatIfEnabled: 'true'

      - name: 'Plan: Governance-Landing Zones Online'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-landingzones-online }}
        with:
          name: 'governance-landingzones-online'
          displayName: 'Governance-Landing Zones Online'
          templateFilePath: 'templates/core/governance/mgmt-groups/landingzones/landingzones-online/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/landingzones/landingzones-online/main.bicepparam'
          managementGroupId: '${{ env.MANAGEMENT_GROUP_ID }}'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'
          firstRunWhatIf: 'false'
          whatIfEnabled: 'true'

      - name: 'Plan: Governance-Platform'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-platform }}
        with:
          name: 'governance-platform'
          displayName: 'Governance-Platform'
          templateFilePath: 'templates/core/governance/mgmt-groups/platform/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/platform/main.bicepparam'
          managementGroupId: '${{ env.MANAGEMENT_GROUP_ID }}'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'
          firstRunWhatIf: 'false'
          whatIfEnabled: 'true'

      - name: 'Plan: Governance-Platform Connectivity'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-platform-connectivity }}
        with:
          name: 'governance-platform-connectivity'
          displayName: 'Governance-Platform Connectivity'
          templateFilePath: 'templates/core/governance/mgmt-groups/platform/platform-connectivity/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/platform/platform-connectivity/main.bicepparam'
          managementGroupId: '${{ env.MANAGEMENT_GROUP_ID }}'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'
          firstRunWhatIf: 'false'
          whatIfEnabled: 'true'

      - name: 'Plan: Governance-Platform Identity'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-platform-identity }}
        with:
          name: 'governance-platform-identity'
          displayName: 'Governance-Platform Identity'
          templateFilePath: 'templates/core/governance/mgmt-groups/platform/platform-identity/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/platform/platform-identity/main.bicepparam'
          managementGroupId: '${{ env.MANAGEMENT_GROUP_ID }}'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'
          firstRunWhatIf: 'false'
          whatIfEnabled: 'true'

      - name: 'Plan: Governance-Platform Management'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-platform-management }}
        with:
          name: 'governance-platform-management'
          displayName: 'Governance-Platform Management'
          templateFilePath: 'templates/core/governance/mgmt-groups/platform/platform-management/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/platform/platform-management/main.bicepparam'
          managementGroupId: '${{ env.MANAGEMENT_GROUP_ID }}'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'
          firstRunWhatIf: 'false'
          whatIfEnabled: 'true'

      - name: 'Plan: Governance-Platform Security'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-platform-security }}
        with:
          name: 'governance-platform-security'
          displayName: 'Governance-Platform Security'
          templateFilePath: 'templates/core/governance/mgmt-groups/platform/platform-security/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/platform/platform-security/main.bicepparam'
          managementGroupId: '${{ env.MANAGEMENT_GROUP_ID }}'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'
          firstRunWhatIf: 'false'
          whatIfEnabled: 'true'

      - name: 'Plan: Governance-Sandbox'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-sandbox }}
        with:
          name: 'governance-sandbox'
          displayName: 'Governance-Sandbox'
          templateFilePath: 'templates/core/governance/mgmt-groups/sandbox/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/sandbox/main.bicepparam'
          managementGroupId: '${{ env.MANAGEMENT_GROUP_ID }}'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'
          firstRunWhatIf: 'false'
          whatIfEnabled: 'true'

      - name: 'Plan: Governance-Decommissioned'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-decommissioned }}
        with:
          name: 'governance-decommissioned'
          displayName: 'Governance-Decommissioned'
          templateFilePath: 'templates/core/governance/mgmt-groups/decommissioned/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/decommissioned/main.bicepparam'
          managementGroupId: '${{ env.MANAGEMENT_GROUP_ID }}'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'
          firstRunWhatIf: 'false'
          whatIfEnabled: 'true'

      - name: 'Plan: Governance-Platform RBAC'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-platform-rbac }}
        with:
          name: 'governance-platform-rbac'
          displayName: 'Governance-Platform RBAC'
          templateFilePath: 'templates/core/governance/mgmt-groups/platform/main-rbac.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/platform/main-rbac.bicepparam'
          managementGroupId: '${{ env.MANAGEMENT_GROUP_ID }}'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'
          firstRunWhatIf: 'false'
          whatIfEnabled: 'true'

      - name: 'Plan: Governance-Platform Connectivity RBAC'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-platform-connectivity-rbac }}
        with:
          name: 'governance-platform-connectivity-rbac'
          displayName: 'Governance-Platform Connectivity RBAC'
          templateFilePath: 'templates/core/governance/mgmt-groups/platform/platform-connectivity/main-rbac.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/platform/platform-connectivity/main-rbac.bicepparam'
          managementGroupId: '${{ env.MANAGEMENT_GROUP_ID }}'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'
          firstRunWhatIf: 'false'
          whatIfEnabled: 'true'

      - name: 'Plan: Governance-Landing Zones RBAC'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-landingzones-rbac }}
        with:
          name: 'governance-landingzones-rbac'
          displayName: 'Governance-Landing Zones RBAC'
          templateFilePath: 'templates/core/governance/mgmt-groups/landingzones/main-rbac.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/landingzones/main-rbac.bicepparam'
          managementGroupId: '${{ env.MANAGEMENT_GROUP_ID }}'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'
          firstRunWhatIf: 'false'
          whatIfEnabled: 'true'

      - name: 'Plan: Core-Logging'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.core-logging }}
        with:
          name: 'core-logging'
          displayName: 'Core-Logging'
          templateFilePath: 'templates/core/logging/main.bicep'
          templateParametersFilePath: 'templates/core/logging/main.bicepparam'
          managementGroupId: ''
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'subscription'
          firstRunWhatIf: 'false'
          whatIfEnabled: 'true'

      - name: 'Plan: Networking-Hub Networking'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.networking-hubnetworking }}
        with:
          name: 'networking-hubnetworking'
          displayName: 'Networking-Hub Networking'
          templateFilePath: 'templates/networking/hubnetworking/main.bicep'
          templateParametersFilePath: 'templates/networking/hubnetworking/main.bicepparam'
          managementGroupId: ''
          subscriptionId: '${{ env.SUBSCRIPTION_ID_CONNECTIVITY }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'subscription'
          firstRunWhatIf: 'false'
          whatIfEnabled: 'true'

  # ============================================================
  # Deploy Wave 1: Governance Root (must deploy first)
  # ============================================================
  deploy-governance-root:
    name: 'Deploy: Governance Root'
    if: ${{ inputs.governance-int-root }}
    runs-on: ubuntu-latest
    environment: cmalz-mgmt-apply
    permissions:
      id-token: write
      contents: read
    env:
      PARAMETERS_FILE_NAME: parameters.json
    steps:
      - uses: actions/checkout@v4
      - uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-variables@main
        with:
          parameters_file_name: ${{ env.PARAMETERS_FILE_NAME }}
      - uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-installer@main
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true
      - name: 'Deploy: Governance-Intermediate Root'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        with:
          name: 'governance-int-root'
          displayName: 'Governance-Intermediate Root'
          templateFilePath: 'templates/core/governance/mgmt-groups/int-root/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/int-root/main.bicepparam'
          managementGroupId: '${{ env.MANAGEMENT_GROUP_ID }}'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'

  # ============================================================
  # Deploy Wave 2: Parent MGs (runs in PARALLEL with deploy-core)
  # ============================================================
  deploy-governance-parents:
    name: 'Deploy: Governance Parents'
    needs: deploy-governance-root
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: cmalz-mgmt-apply
    permissions:
      id-token: write
      contents: read
    env:
      PARAMETERS_FILE_NAME: parameters.json
    steps:
      - uses: actions/checkout@v4
      - uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-variables@main
        with:
          parameters_file_name: ${{ env.PARAMETERS_FILE_NAME }}
      - uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-installer@main
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: 'Deploy: Governance-Landing Zones'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-landingzones }}
        with:
          name: 'governance-landingzones'
          displayName: 'Governance-Landing Zones'
          templateFilePath: 'templates/core/governance/mgmt-groups/landingzones/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/landingzones/main.bicepparam'
          managementGroupId: '${{ env.MANAGEMENT_GROUP_ID }}'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'

      - name: 'Deploy: Governance-Platform'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-platform }}
        with:
          name: 'governance-platform'
          displayName: 'Governance-Platform'
          templateFilePath: 'templates/core/governance/mgmt-groups/platform/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/platform/main.bicepparam'
          managementGroupId: '${{ env.MANAGEMENT_GROUP_ID }}'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'

      - name: 'Deploy: Governance-Sandbox'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-sandbox }}
        with:
          name: 'governance-sandbox'
          displayName: 'Governance-Sandbox'
          templateFilePath: 'templates/core/governance/mgmt-groups/sandbox/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/sandbox/main.bicepparam'
          managementGroupId: '${{ env.MANAGEMENT_GROUP_ID }}'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'

      - name: 'Deploy: Governance-Decommissioned'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-decommissioned }}
        with:
          name: 'governance-decommissioned'
          displayName: 'Governance-Decommissioned'
          templateFilePath: 'templates/core/governance/mgmt-groups/decommissioned/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/decommissioned/main.bicepparam'
          managementGroupId: '${{ env.MANAGEMENT_GROUP_ID }}'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'

  # ============================================================
  # Deploy Wave 3a: LZ Children (PARALLEL with 3b)
  # ============================================================
  deploy-governance-children-lz:
    name: 'Deploy: LZ Children'
    needs: deploy-governance-parents
    if: ${{ always() && !failure() && !cancelled() && (inputs.governance-landingzones-corp || inputs.governance-landingzones-online) }}
    runs-on: ubuntu-latest
    environment: cmalz-mgmt-apply
    permissions:
      id-token: write
      contents: read
    env:
      PARAMETERS_FILE_NAME: parameters.json
    steps:
      - uses: actions/checkout@v4
      - uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-variables@main
        with:
          parameters_file_name: ${{ env.PARAMETERS_FILE_NAME }}
      - uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-installer@main
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: 'Deploy: Governance-Landing Zones Corp'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-landingzones-corp }}
        with:
          name: 'governance-landingzones-corp'
          displayName: 'Governance-Landing Zones Corp'
          templateFilePath: 'templates/core/governance/mgmt-groups/landingzones/landingzones-corp/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/landingzones/landingzones-corp/main.bicepparam'
          managementGroupId: '${{ env.MANAGEMENT_GROUP_ID }}'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'

      - name: 'Deploy: Governance-Landing Zones Online'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-landingzones-online }}
        with:
          name: 'governance-landingzones-online'
          displayName: 'Governance-Landing Zones Online'
          templateFilePath: 'templates/core/governance/mgmt-groups/landingzones/landingzones-online/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/landingzones/landingzones-online/main.bicepparam'
          managementGroupId: '${{ env.MANAGEMENT_GROUP_ID }}'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'

  # ============================================================
  # Deploy Wave 3b: Platform Children (PARALLEL with 3a)
  # ============================================================
  deploy-governance-children-platform:
    name: 'Deploy: Platform Children'
    needs: deploy-governance-parents
    if: ${{ always() && !failure() && !cancelled() && (inputs.governance-platform-connectivity || inputs.governance-platform-identity || inputs.governance-platform-management || inputs.governance-platform-security) }}
    runs-on: ubuntu-latest
    environment: cmalz-mgmt-apply
    permissions:
      id-token: write
      contents: read
    env:
      PARAMETERS_FILE_NAME: parameters.json
    steps:
      - uses: actions/checkout@v4
      - uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-variables@main
        with:
          parameters_file_name: ${{ env.PARAMETERS_FILE_NAME }}
      - uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-installer@main
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: 'Deploy: Governance-Platform Connectivity'
        uses: cmcc-org01/cmalz-mgmt-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-platform-connectivity }}
        with:
          name: 'governance-platform-connectivity'
          displayName: 'Governance-Platform Connectivity'
          templateFilePath: 'templates/core/governance/mgmt-groups/platform/platform-connectivity/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/platform/platform-connectivity/main.bicepparam'
          managementGroupId: '${{ env.MANAGEMENT_GROUP_ID }}'
